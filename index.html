<!doctype html>

    <script>
      // Suppress Vite HMR WebSocket connection errors as HMR is disabled in this environment
      (function() {
        try {
          // 1. Monkey patch console.error to filter out WebSocket HMR errors
          var origConsoleError = console.error;
          console.error = function() {
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              var msg = (arg && (arg.message || arg.stack || String(arg))) || '';
              if (
                msg.indexOf('WebSocket') !== -1 ||
                msg.indexOf('ws:') !== -1 ||
                msg.indexOf('[vite]') !== -1
              ) {
                return;
              }
            }
            return origConsoleError.apply(console, arguments);
          };

          // 2. Mock WebSocket for vite-hmr / vite-ping so it reports OPEN (1 === 1) and never triggers close error
          if (typeof window !== 'undefined' && window.WebSocket) {
            var NativeWebSocket = window.WebSocket;
            var WrappedWebSocket = function(url, protocols) {
              var isViteWs = false;
              try {
                var urlStr = String(url);
                if (
                  protocols === 'vite-hmr' ||
                  protocols === 'vite-ping' ||
                  (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) ||
                  urlStr.indexOf('vite-hmr') !== -1 ||
                  urlStr.indexOf('token=') !== -1
                ) {
                  isViteWs = true;
                }
              } catch (e) {}

              if (isViteWs) {
                return {
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  readyState: 1,
                  url: String(url),
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                  binaryType: 'blob',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  addEventListener: function(type, listener) {
                    if (type === 'open' && typeof listener === 'function') {
                      setTimeout(function() {
                        try {
                          listener({ type: 'open' });
                        } catch (err) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; },
                  send: function() {},
                  close: function() {},
                };
              }
              return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            };
            WrappedWebSocket.prototype = NativeWebSocket.prototype;
            WrappedWebSocket.CONNECTING = 0;
            WrappedWebSocket.OPEN = 1;
            WrappedWebSocket.CLOSING = 2;
            WrappedWebSocket.CLOSED = 3;
            window.WebSocket = WrappedWebSocket;
          }

          // 3. Catch window unhandled errors and rejections related to WebSocket
          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || '')) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = (event && event.reason && (event.reason.message || String(event.reason))) || '';
            if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('ws:') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);

          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } catch (e) {}
      })();
    </script>
