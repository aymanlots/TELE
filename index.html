    <script>
      // Suppress Vite HMR WebSocket connection errors as HMR is disabled in this environment
      (function() {
        try {
          // 1. Monkey patch console.error to filter out WebSocket HMR errors
          var origConsoleError = console.error;
          console.error = function() {
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              var msg = (arg && (arg.message || arg.stack || String(arg))) || '';
              if (
                msg.indexOf('WebSocket') !== -1 ||
                msg.indexOf('ws:') !== -1 ||
                msg.indexOf('[vite]') !== -1
              ) {
                return;
              }
            }
            return origConsoleError.apply(console, arguments);
          };

          // 2. Mock WebSocket for vite-hmr to prevent unclean disconnection errors
          if (typeof window !== 'undefined' && window.WebSocket) {
            var NativeWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var isViteHmr = false;
              try {
                var urlStr = String(url);
                if (
                  protocols === 'vite-hmr' ||
                  (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                  urlStr.indexOf('vite-hmr') !== -1
                ) {
                  isViteHmr = true;
                }
              } catch (e) {}

              if (isViteHmr) {
                return {
                  readyState: 3,
                  url: String(url),
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: 'vite-hmr',
                  binaryType: 'blob',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  addEventListener: function(type, listener) {
                    if (type === 'close') {
                      setTimeout(function() {
                        try {
                          listener({ wasClean: true, code: 1000, reason: 'HMR disabled' });
                        } catch (err) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  send: function() {},
                  close: function() {},
                };
              }
              return new NativeWebSocket(url, protocols);
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
          }

          // 3. Catch window unhandled errors and rejections related to WebSocket
          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || '')) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = (event && event.reason && (event.reason.message || String(event.reason))) || '';
            if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('ws:') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);

          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } catch (e) {}
      })();
    </script>
